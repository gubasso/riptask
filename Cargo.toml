[package]
name = "riptsk"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tsk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
camino = { version = "1.2.2", features = ["serde1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
comfy-table = "7"
console = "0.16"
dialoguer = "0.12"
gitlab = "0.1809"
indicatif = "0.18"
jiff = { version = "0.2.23", features = ["serde"] }
octocrab = "0.49"
rustls = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
termtree = "1.0.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "sync", "time"] }
walkdir = "2.5.0"
xdg = "3.0.0"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
wiremock = "0.6"
