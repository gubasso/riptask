[package]
name = "riptsk"
version = "0.1.0"
edition = "2024"
description = "A CLI task manager with GitHub, GitLab, and Jira integration"
license = "MIT"
repository = "https://github.com/gubasso/riptsk"

[[bin]]
name = "tsk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22"
camino = { version = "1.2.2", features = ["serde1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
comfy-table = "7"
console = "0.16"
dialoguer = "0.12"
gitlab = "0.1809"
indicatif = "0.18"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
octocrab = "0.49"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
rustls = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
minijinja = "2"
shell-escape = "0.1"
tempfile = "3.27.0"
termtree = "1.0.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
walkdir = "2.5.0"
xdg = "3.0.0"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
wiremock = "0.6"
