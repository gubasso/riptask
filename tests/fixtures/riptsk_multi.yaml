version: 1
defaults:
  board: personal
  status: todo
  priority: medium
  assignee: tester
  template: task
backends:
  - name: wormhole-router
    type: gitlab
    host: https://gitlab.example.com
    repo: chrono/wormhole-router
    key: GL-CHR-WOR
    default_board: penguin-chrono-labs
    default_org: chrono
  - name: fish-from-the-future
    type: github
    repo: Penguin-Chrono-Labs/fish-from-the-future
    key: GH-PEN-FIS
    default_board: penguin-chrono-labs
    default_org: chrono
  - name: penguin-scratch
    type: local
    repo: ~
    path: /tmp/penguin-scratch
    key: LO-PEN
    default_board: personal
    default_org: ~
boards:
  - name: penguin-chrono-labs
    statuses: [backlog, todo, in-progress, review, done]
  - name: personal
    statuses: [backlog, todo, in-progress, done]
ui:
  opener: "nvim -R"
  tree_depth: 2
  fzf_opts: "--border"
ai:
  enabled: false
  features:
    new_body_gen: true
    triage: true
    summarize: true
    ask: true
sync:
  conflict_detection: true
recurring:
  - id: recur-weekly-review
    template: templates/weekly-review.md
    title_pattern: "Weekly review - {YYYY-MM-DD}"
    board: personal
    project: personal
    org: ~
    status: todo
    priority: medium
    assignee: tester
    labels: [recurring, review]
    frequency: weekly
    day_of_week: monday
    start: "2026-03-17"
    end: ~
    last_run: ~
