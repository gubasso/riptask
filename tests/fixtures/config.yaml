version: 1
defaults:
  board: personal
  status: todo
  priority: medium
  assignee: tester
  template: task
projects:
  - name: wormhole-router
    vc_backend:
      type: gitlab
      host: https://gitlab.example.com
      repo: chrono/wormhole-router
    tasks_backend:
      type: gitlab
      host: https://gitlab.example.com
      repo: chrono/wormhole-router
    key: GL-CHR-WOR
    default_board: personal
    default_org: chrono
boards:
  - name: personal
    statuses: [backlog, todo, in-progress, review, done]
ui:
  opener: "nvim -R"
  tree_depth: 2
  fzf_opts: "--border"
ai:
  enabled: false
  features:
    new_body_gen: true
    triage: true
    summarize: true
    ask: true
sync:
  conflict_detection: true
recurring: []
